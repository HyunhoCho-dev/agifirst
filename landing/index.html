<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGIfirst - Download</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🤖</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 50px 40px;
            text-align: center;
        }

        .logo {
            font-size: 80px;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-size: 2.5em;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 1.2em;
            margin-bottom: 40px;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 40px;
            text-align: left;
        }

        .feature {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .feature-icon {
            font-size: 24px;
        }

        .feature-text {
            font-size: 14px;
            color: #555;
        }

        .download-section {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            text-align: left;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        input[type="password"],
        input[type="text"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="password"]:focus,
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .download-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .download-btn:active {
            transform: translateY(0);
        }

        .download-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .platform-select {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .platform-btn {
            flex: 1;
            padding: 12px;
            background: white;
            border: 2px solid #ddd;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }

        .platform-btn.selected {
            border-color: #667eea;
            background: #f0f3ff;
            color: #667eea;
        }

        .help-text {
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }

        .help-text a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .help-text a:hover {
            text-decoration: underline;
        }

        .info-box {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            text-align: left;
        }

        .info-box h3 {
            color: #1976d2;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .info-box ol {
            margin-left: 20px;
            color: #555;
        }

        .info-box li {
            margin-bottom: 8px;
            font-size: 14px;
        }

        .error {
            color: #f44336;
            margin-top: 10px;
            font-size: 14px;
        }

        .success {
            color: #4caf50;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🤖</div>
        <h1>AGIfirst</h1>
        <p class="subtitle">AI Browser Control - Local Edition</p>

        <div class="features">
            <div class="feature">
                <div class="feature-icon">🔒</div>
                <div class="feature-text">100% 로컬 실행</div>
            </div>
            <div class="feature">
                <div class="feature-icon">⚡</div>
                <div class="feature-text">빠른 응답 속도</div>
            </div>
            <div class="feature">
                <div class="feature-icon">🛡️</div>
                <div class="feature-text">개인정보 보호</div>
            </div>
            <div class="feature">
                <div class="feature-icon">🎮</div>
                <div class="feature-text">브라우저 자동화</div>
            </div>
        </div>

        <div class="download-section">
            <div class="input-group">
                <label for="apiKey">Groq API Key</label>
                <input
                    type="password"
                    id="apiKey"
                    placeholder="gsk_..."
                    autocomplete="off"
                />
            </div>

            <div class="platform-select">
                <button class="platform-btn selected" data-platform="windows">
                    🪟 Windows
                </button>
                <button class="platform-btn" data-platform="mac">
                    🍎 macOS
                </button>
                <button class="platform-btn" data-platform="linux">
                    🐧 Linux
                </button>
            </div>

            <button class="download-btn" id="downloadBtn">
                다운로드
            </button>

            <div id="message"></div>

            <p class="help-text">
                API 키가 없으신가요?
                <a href="https://console.groq.com/" target="_blank">여기서 무료로 발급</a>
            </p>
        </div>

        <div class="info-box">
            <h3>📝 사용 방법</h3>
            <ol>
                <li>Groq API 키를 입력하세요</li>
                <li>운영체제를 선택하세요</li>
                <li>다운로드 버튼을 클릭하세요</li>
                <li>다운로드한 파일을 실행하세요</li>
                <li>브라우저가 자동으로 열립니다!</li>
            </ol>
        </div>
    </div>

    <script src="download.js"></script>
</body>
</html>
